<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title description">
  <title id="title">Calibration Loop</title>
  <desc id="description">Behavioral diagram in the chapter's negotiation-loop style. EnvironmentAgent reports an observation to SafetyAgent, which reviews the evidence. The custom manager, InvestigationManager, interprets the verdict and selects the next participant. CALIBRATION returns to EnvironmentAgent when fewer than two observations are complete, or selects MaintenanceAgent when at least two observations are complete and calibration is incomplete. MaintenanceAgent returns its result for another safety review. DENIED ends the investigation; APPROVED ends it when calibration is complete. The turn-ceiling exit is omitted for clarity. CALIBRATION requests work and never confirms that calibration succeeded. Actual messages are mediated by the group-chat host.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#595959"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #000000; text-anchor: middle; }
      .participant { fill: #b6d7a8; stroke: #595959; stroke-width: 1.7; }
      .manager { fill: #fff2cc; stroke: #595959; stroke-width: 1.7; }
      .flow { fill: none; stroke: #595959; stroke-width: 1.7; stroke-linejoin: round; marker-end: url(#arrow); }
      .agent-name { font-size: 30px; font-weight: 700; font-style: italic; }
      .manager-name { font-size: 30px; font-weight: 700; }
      .state { font-size: 28px; font-weight: 700; font-style: italic; fill: #ff0000; }
      .condition { font-size: 19px; fill: #595959; }
      .footnote { font-size: 24px; fill: #595959; }
    </style>
  </defs>

  <rect width="1500" height="650" fill="#ffffff"/>

  <g id="transitions">
    <path id="start-observation" class="flow" d="M 50 318 H 148"/>
    <path id="observation-review" class="flow" d="M 409 318 H 505"/>
    <path id="review-decision" class="flow" d="M 705 318 H 799"/>
    <path id="terminal-verdict" class="flow" d="M 1142 318 H 1229"/>
    <path id="calibration-more-observations" class="flow" d="M 971 378 V 421 H 267 V 363"/>
    <path id="calibration-maintenance" class="flow" d="M 971 258 V 185"/>
    <path id="maintenance-review" class="flow" d="M 848 140 H 605 V 274"/>
  </g>

  <g id="environment-agent">
    <polygon class="participant" points="138,362 159,275 419,275 398,362"/>
    <text x="279" y="312" class="agent-name">Environment</text>
    <text x="279" y="346" class="agent-name">Agent</text>
  </g>

  <g id="safety-agent">
    <polygon class="participant" points="495,362 516,275 715,275 694,362"/>
    <text x="605" y="312" class="agent-name">Safety</text>
    <text x="605" y="346" class="agent-name">Agent</text>
  </g>

  <g id="maintenance-agent">
    <polygon class="participant" points="838,184 859,97 1105,97 1084,184"/>
    <text x="972" y="134" class="agent-name">Maintenance</text>
    <text x="972" y="168" class="agent-name">Agent</text>
  </g>

  <g id="manager-policy">
    <ellipse class="manager" cx="971" cy="318" rx="171" ry="60"/>
    <text x="871" y="339" style="font-size:60px">?</text>
    <text x="980" y="310" class="manager-name">Custom</text>
    <text x="980" y="345" class="manager-name">Manager</text>
  </g>

  <g id="terminal-state">
    <circle cx="1265" cy="318" r="35" fill="#eeeeee" stroke="#595959" stroke-width="1.7"/>
    <circle cx="1265" cy="318" r="18" fill="#ffffff" stroke="#595959" stroke-width="1.7"/>
  </g>

  <g id="decision-labels">
    <text x="815" y="214" class="state">CALIBRATION</text>
    <text x="815" y="237" class="condition">at least two observations;</text>
    <text x="815" y="260" class="condition">not calibrated</text>

    <text x="800" y="463" class="state">CALIBRATION</text>
    <text x="800" y="492" class="condition">fewer than two observations</text>

    <text x="1265" y="245" class="state">APPROVED</text>
    <text x="1265" y="272" class="condition">calibration complete</text>
    <text x="1265" y="402" class="state">DENIED: reason</text>
  </g>

  <text x="750" y="590" class="footnote">For clarity, this flow omits the path taken when the turn limit is reached.</text>
</svg>
